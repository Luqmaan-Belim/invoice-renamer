name: invoice_renamer

on:
  # Heartbeat only. GitHub scheduled events can be delayed/dropped, so the
  # workflow also queues its own next run after each completed sweep.
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}
  repository_dispatch:
    types: [drive_change]
  push:
    branches: [main]
    paths:
      - ".github/workflows/invoice-renamer.yml"
      - "runner.py"
      - "process_invoices.py"
      - "odoo_attach.py"
      - "requirements.txt"

permissions:
  contents: read
  actions: write

# Never OCR the same Drive backlog in parallel. GitHub keeps at most one running
# and one pending run in this concurrency group.
concurrency:
  group: invoice-renamer-production
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python requirements
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run invoice, delivery note and claim sweep
        timeout-minutes: 15
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          DEBUG_LIST: ${{ vars.DEBUG_LIST }}
          ENABLE_ODOO: "1"
          ODOO_URL: ${{ secrets.ODOO_URL }}
          ODOO_DB: ${{ secrets.ODOO_DB }}
          ODOO_USER: ${{ secrets.ODOO_USER }}
          ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
          MAX_FILES_PER_RUN: "40"
          CLAIM_LOOKBACK_DAYS: "365"
          REVIEW_RETRY_HOURS: "6"
          MANUAL_REVIEW_AFTER: "2"
        run: |
          python runner.py

      # Primary scheduler: after this sweep finishes, keep this job alive for one
      # minute and queue the next workflow_dispatch run. workflow_dispatch events
      # created with GITHUB_TOKEN are explicitly allowed to start another workflow.
      - name: Queue next run in 60 seconds
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 60
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/invoice-renamer.yml/dispatches" \
            --data '{"ref":"main"}'
