name: invoice_renamer_fallback

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
  repository_dispatch:
    types: [drive_change]

# Automatic GitHub fallback while the persistent OCI runner is being commissioned.
# GitHub Actions scheduled workflows have a 5-minute minimum interval.
# Only one sweep may run at a time so a slow backlog run cannot overlap the next one.
concurrency:
  group: invoice-renamer-fallback
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python requirements
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bounded invoice, delivery note and claim sweep
        timeout-minutes: 15
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          DEBUG_LIST: ${{ vars.DEBUG_LIST }}
          ENABLE_ODOO: "1"
          ODOO_URL: ${{ secrets.ODOO_URL }}
          ODOO_DB: ${{ secrets.ODOO_DB }}
          ODOO_USER: ${{ secrets.ODOO_USER }}
          ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
          MAX_FILES_PER_RUN: "40"
          CLAIM_LOOKBACK_DAYS: "365"
          REVIEW_RETRY_HOURS: "6"
          MANUAL_REVIEW_AFTER: "2"
        run: |
          python runner.py
